name: Arena Phase 1 QA
on:
  push:
    branches: [ccg-pvp-battlegrounds, arena-character-overhaul, arena-premium-character-v2, arena-unified-art-v3, arena-character-v4]
  pull_request:
    branches: [v8-aurum-elite, ccg-pvp-battlegrounds]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Arena scripts
        run: |
          node --check arena/engine.js
          node --check arena/app.js
          node --check arena/characters.js
      - name: Verify original V8 and new Arena rules
        run: node --test tests/core.test.cjs tests/v8-tactical.test.cjs tests/arena.test.cjs tests/characters.test.cjs tests/premium_art_v3.test.cjs
      - name: Simulate 100,000 complete Arena matches
        run: node tests/arena_balance.cjs --games 100000
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Arena mobile and desktop smoke checks
        run: python tests/arena_browser_check.py
      - name: Original Classic browser regression checks
        run: python tests/browser_checks.py
