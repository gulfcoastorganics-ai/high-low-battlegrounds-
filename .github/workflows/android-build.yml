name: Build HIGH LOW Android APK
on:
  push:
    branches: [main, v6-audit-upgrade, arena-character-overhaul]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android command-line SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Copy complete offline game into Android assets
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cp -R assets app/src/main/assets/assets
          cp -R arena app/src/main/assets/arena
          test -s app/src/main/assets/index.html
          test -s app/src/main/assets/assets/cards/S-A.svg
          test -s app/src/main/assets/arena/art/precision.svg
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battleground-V6-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
